# Local development and single-host deployment for musicrec.
#
# Services:
#   api      - FastAPI service (src/musicrec), served by uvicorn on :8000
#   worker   - PLACEHOLDER: no worker module exists in the codebase yet
#              (the refactor plan in src/musicrec/main.py calls for RQ workers)
#   postgres - PostgreSQL 16 (not yet read by the app; reserved for the roadmap)
#   redis    - Redis 7 (not yet read by the app; reserved for the roadmap)
#
# Copy .env.example to .env before running:  docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: musicrec-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Reserved for the SaaS roadmap: Settings has no fields for these yet
      # (extra="ignore"), so they are harmless placeholders.
      DATABASE_URL: postgresql://${POSTGRES_USER:-musicrec}:${POSTGRES_PASSWORD:-musicrec}@postgres:5432/${POSTGRES_DB:-musicrec}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Health endpoint is /api/v1/health (src/musicrec/main.py mounts the
      # health router under the /api/v1 prefix).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: musicrec-worker
    # PLACEHOLDER: there is no worker entry point in the codebase yet.
    # Per the refactor plan (src/musicrec/main.py docstring), workers will
    # be RQ-based; once musicrec.worker (or an rq entry point) lands, replace
    # the command below (e.g. `rq worker --url "$REDIS_URL" ...`). Until then
    # `python -m musicrec.worker` fails with ModuleNotFoundError; restart is
    # disabled so the container fails loudly, once, instead of crash-looping.
    command: ["python", "-m", "musicrec.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-musicrec}:${POSTGRES_PASSWORD:-musicrec}@postgres:5432/${POSTGRES_DB:-musicrec}
      REDIS_URL: redis://redis:6379/0
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicrec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicrec}
      POSTGRES_DB: ${POSTGRES_DB:-musicrec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose substitution so the shell inside the container
      # expands the postgres image's own environment.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
